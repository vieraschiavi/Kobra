name: Entrenar ProbPago (ML)

# Reentrena y compara modelos ML de probabilidad de pago.
# Se dispara manualmente o de forma programada (semanal).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install joblib

      - name: Generar dataset
        run: python data/generate_dataset.py --n 12000 --seed 42

      - name: Selección de modelos (CV + calibración)
        run: python -m kobra.train

      - name: Publicar artefactos del modelo
        uses: actions/upload-artifact@v4
        with:
          name: probpago-model
          path: |
            outputs/probpago_model.joblib
            outputs/model_selection.json
          if-no-files-found: warn
