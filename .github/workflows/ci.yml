name: CI

# Objetivo: validar el código gastando el mínimo de minutos de GitHub Actions.
# - paths-ignore: cambios de docs/config no disparan CI (no hay código que validar).
# - concurrency: cancela corridas viejas de la misma rama cuando llega un push nuevo.
# - pasos pesados (train + pipeline end-to-end) solo en push a main; los PR corren
#   solo los tests. Así un PR gasta ~1/3 de lo que gastaba antes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'presentation/**'
      - '.mcp.json.example'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - 'presentation/**'
      - '.mcp.json.example'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        # Las de test salen de requirements-dev.txt, no de un `pip install`
        # suelto: si estan declaradas en un solo lugar, una maquina limpia que
        # siga el README puede correr la suite. Antes `pytest` no figuraba en
        # ningun requirements y solo lo instalaba esta linea.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          # 22 y no 20: los runners ya avisan que Node 20 está deprecado, y el
          # patrón de `npm test` se resuelve solo (el shell lo expande, y si no
          # lo hace —Windows— el propio Node ≥22 lo interpreta como glob).
          node-version: "22"
          cache: npm

      - name: Instalar dependencias de las funciones serverless
        # `api/checkout.js` requiere `botid/server` (verificación de bots de
        # Vercel). Sin esto, `tests/test_venta_pago_a_producto.py` —que arranca
        # el checkout con node para comprobar que el plan cobrado es el que
        # después se licencia— moría con MODULE_NOT_FOUND en CI y pasaba solo
        # en las máquinas que ya tenían node_modules. O sea: el test que cuida
        # el camino del que paga estaba, en los hechos, apagado en CI.
        run: npm ci

      - name: Instalar NSIS (compilador del instalador de Windows)
        # `tests/test_disco_y_carpeta_datos.py` compila `installer.nsh` con
        # makensis en vez de leerlo como texto. Sin NSIS en el runner ese test
        # se saltea, y justamente es el unico que ve un macro sin cerrar o una
        # variable que no existe — que NSIS degrada a warning y deja pasar,
        # dejando la pagina del asistente rota sin que falle nada. Son ~2 MB y
        # unos segundos; el error que evita cuesta un build de Windows entero.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Linter
        # Antes del test: un import roto o una variable indefinida los detecta
        # ruff en segundos, sin esperar los dos minutos de la suite.
        run: ruff check .

      - name: Tests de las funciones serverless (node --test)
        # Las 47 pruebas de `api/*.test.js` (emisión y validación de licencias,
        # webhook de MercadoPago, rate limit) no las corría NADIE en CI: el job
        # era solo de Python. Un cambio en el emisor de licencias podía llegar
        # a main sin que se ejecutara una sola de sus pruebas.
        run: npm test

      - name: Generar dataset (semilla fija)
        run: python data/generate_dataset.py --n 3000 --seed 42

      - name: Tests
        run: python -m pytest -q tests/

      # Pasos pesados solo al mergear a main (no en cada PR) para ahorrar minutos.
      - name: Selección de modelos (CV + calibración)
        if: github.event_name == 'push'
        run: python -m kobra.train

      - name: Smoke test del pipeline end-to-end (usa el modelo seleccionado)
        if: github.event_name == 'push'
        run: python -m kobra.pipeline
