name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest joblib

      - name: Generar dataset (semilla fija)
        run: python data/generate_dataset.py --n 3000 --seed 42

      - name: Tests
        run: python -m pytest -q tests/

      - name: Selección de modelos (CV + calibración)
        run: python -m kobra.train

      - name: Smoke test del pipeline end-to-end (usa el modelo seleccionado)
        run: python -m kobra.pipeline
