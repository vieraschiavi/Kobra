name: build-windows-installer

# Construye el PROGRAMA DE ESCRITORIO de Windows (MVKobraAI_Setup.exe):
# la app Electron (electron/) con la UI React + el motor (FastAPI + ML)
# empaquetado con PyInstaller, envuelto por electron-builder en un
# instalador NSIS profesional CON desinstalador (aparece en "Agregar o
# quitar programas"). El .exe queda descargable como artefacto y, al
# taguear vX.Y.Z, se publica en una Release de GitHub.

on:
  workflow_dispatch: {}
  # Sin filtro de rutas: así el build por TAG (para la Release) siempre corre.
  # En main también corre completo para publicar/actualizar la Release: es el
  # único canal de descarga estable del instalador (los artifacts expiran y
  # su cuota se llena; el bot tampoco puede pushear tags ni despachar runs).
  # Solo main y tags: los minutos de Windows facturan al DOBLE y compilar el
  # instalador en cada push de una rama de trabajo agotó la cuota mensual de
  # Actions (jul 2026) — en ramas alcanza con el CI de Ubuntu.
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Generar datos y modelo (para empaquetar la demo lista)
        run: python -m kobra.pipeline

      - name: Setup Node (para compilar la app React del instalador)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar la app React (webapp/frontend/dist)
        # kobra_launcher.py ahora arranca la app completa (React + FastAPI),
        # no Streamlit — el backend sirve este build compilado como estático.
        # Node solo hace falta acá, en CI; nunca en la PC del cliente final.
        run: |
          cd webapp/frontend
          npm ci
          npm run build

      - name: Construir ejecutable (PyInstaller)
        run: pyinstaller packaging/kobra.spec --noconfirm --clean

      - name: Verificar salida de PyInstaller
        run: |
          if (-Not (Test-Path "dist/MVKobraAI/MVKobraAI.exe")) {
            Write-Error "No se generó dist/MVKobraAI/MVKobraAI.exe"; exit 1
          }
          Write-Host "Bundle OK"

      - name: Leer versión del paquete
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kobra,sys;sys.stdout.write(kobra.__version__)"
          "KVER=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Regenerar las licencias del asistente
        # Llevan la version adentro: si se bumpea VERSION y no se regeneran,
        # el instalador muestra el EULA de una version vieja.
        run: python packaging/licencias_instalador.py

      - name: Construir instalador Electron (NSIS, con desinstalador)
        # electron-builder empaqueta la app de escritorio (electron/main.js +
        # el motor PyInstaller de dist/MVKobraAI como resources/backend) y
        # genera el instalador NSIS: asistente en español/portugués, elección
        # de carpeta, accesos directos y DESINSTALADOR registrado en
        # "Agregar o quitar programas".
        shell: pwsh
        run: |
          cd electron
          npm pkg set version=${{ steps.ver.outputs.KVER }}
          npm ci
          npx electron-builder --win nsis --publish never
          if (-Not (Test-Path "dist_installer/MVKobraAI_Setup.exe")) {
            Write-Error "No se generó el instalador Electron"; exit 1
          }
          Copy-Item "dist_installer/MVKobraAI_Setup.exe" ../dist/
        env:
          # Sin firma de código por ahora: no fallar buscando certificado.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        # La cuota de artifacts se agota seguido y GitHub tarda 6-12 h en
        # recalcularla; que eso no tumbe el build ni bloquee la Release.
        continue-on-error: true
        with:
          name: MVKobraAI_Setup_Windows
          path: dist/MVKobraAI_Setup.exe
          if-no-files-found: error
          # El instalador pesa cientos de MB: sin retención corta, la cuota de
          # almacenamiento de Actions se agota y la subida falla en PRs futuros.
          retention-days: 3

      - name: Publicar en Release (main y tags vX.Y.Z)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # En main crea el tag vX.Y.Z si no existe y sube/reemplaza el .exe;
          # el link estable para el usuario final queda en /releases/latest.
          tag_name: v${{ steps.ver.outputs.KVER }}
          name: MV Kobra AI v${{ steps.ver.outputs.KVER }}
          body: >
            App de escritorio para Windows (Electron + React, no requiere Python). Incluye desinstalador en "Agregar o quitar programas".
            Descargar `MVKobraAI_Setup.exe`, ejecutarlo y seguir el asistente.
          files: dist/MVKobraAI_Setup.exe

      - name: ¿Está configurado el repo público de releases?
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: pub
        shell: pwsh
        run: |
          "TIENE_TOKEN=${{ secrets.RELEASES_TOKEN != '' }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publicar en el repo público de releases (para clientes finales)
        # Este repo (vieraschiavi/Kobra) es privado: el link de Releases de acá
        # no lo puede descargar un cliente sin acceso. Este paso publica una
        # copia en un segundo repo, público y sin código fuente, creado a mano
        # una vez (ver docs/DISTRIBUCION_INSTALADOR.md) con un secret
        # RELEASES_TOKEN (PAT con permiso "contents: write" solo sobre ese
        # repo). Si el secret no está configurado, este paso se salta solo —
        # no rompe el resto del build.
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && steps.pub.outputs.TIENE_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: vieraschiavi/mv-kobra-ai-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ steps.ver.outputs.KVER }}
          name: MV Kobra AI v${{ steps.ver.outputs.KVER }}
          body: >
            App de escritorio para Windows (Electron + React, no requiere Python). Incluye desinstalador en "Agregar o quitar programas".
            Descargar `MVKobraAI_Setup.exe`, ejecutarlo y seguir el asistente.
          files: dist/MVKobraAI_Setup.exe
