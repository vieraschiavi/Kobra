name: build-windows-installer

# Construye el PROGRAMA STANDALONE de Windows (Kobra_Setup.exe): empaqueta
# Python + todas las librerías con PyInstaller y lo envuelve con Inno Setup.
# El .exe queda descargable como artefacto de la corrida y, al taguear vX.Y.Z,
# se publica en una Release de GitHub.

on:
  workflow_dispatch: {}
  # Sin filtro de rutas: así el build por TAG (para la Release) siempre corre.
  push:
    branches: ["claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Generar datos y modelo (para empaquetar la demo lista)
        run: python -m kobra.pipeline

      - name: Construir ejecutable (PyInstaller)
        run: pyinstaller packaging/kobra.spec --noconfirm --clean

      - name: Verificar salida de PyInstaller
        run: |
          if (-Not (Test-Path "dist/Kobra/Kobra.exe")) {
            Write-Error "No se generó dist/Kobra/Kobra.exe"; exit 1
          }
          Write-Host "Bundle OK"

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construir instalador (Inno Setup)
        shell: cmd
        run: |
          for /f "tokens=2 delims== " %%v in ('python -c "import kobra,sys;sys.stdout.write('VER='+kobra.__version__)"') do set KVER=%%v
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=%KVER% packaging\instalador.iss

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Kobra_Setup_Windows
          path: dist/Kobra_Setup_*.exe
          if-no-files-found: error

      - name: Publicar en Release (solo en tags vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Kobra_Setup_*.exe
