# Publica la edición OWNER como release descargable — SOLO en este repo privado.
#
# Por qué acá y no en `mv-kobra-ai-releases`: ese repo es PÚBLICO y es donde va
# el instalador de clientes. La edición Owner arranca sin licencia, sin trial y
# sin vencimiento (`edicion.json` → `owner: true`), así que publicarla ahí
# equivale a regalar el producto completo: cualquiera que la baje la usa sin
# límite y sin pagar. Este workflow escribe únicamente en las releases de
# `vieraschiavi/Kobra`, que es privado — visible solo para vos y los
# colaboradores del repo.
#
# Disparo manual (Actions → Release Owner → Run workflow) o al taguear
# `owner-vX.Y.Z`. No corre en cada push: no hace falta y consume minutos.
name: Release Owner

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.3.0). Vacío = la de build_release.py"
        required: false
        type: string
  push:
    tags:
      - "owner-v*"

permissions:
  contents: write        # crear la release y subirle el ZIP

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias mínimas del empaquetador
        run: pip install -r requirements.txt

      - name: Armar la edición Owner
        id: armar
        run: |
          python - <<'PY'
          import importlib.util, os, tempfile
          spec = importlib.util.spec_from_file_location(
              "br", "packaging/build_release.py")
          br = importlib.util.module_from_spec(spec); spec.loader.exec_module(br)
          with tempfile.TemporaryDirectory() as tmp:
              z = br.build_edicion(tmp, "Owner")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"zip={z}\n")
              f.write(f"version={br.VERSION}\n")
          print("Paquete:", z, os.path.getsize(z) // 1024, "KB")
          PY

      - name: Verificar que el paquete es realmente la edición Owner
        # Un ZIP mal armado que igual se publica es peor que no publicar nada:
        # se descarga, no arranca, y el error aparece recién en la PC.
        run: |
          python - <<'PY'
          import json, sys, zipfile
          z = "${{ steps.armar.outputs.zip }}"
          with zipfile.ZipFile(z) as f:
              nombres = f.namelist()
              ed = json.loads(f.read("kobra_software/edicion.json"))
              faltan = [n for n in (
                  "INSTALAR.bat", "INICIAR_OWNER.bat",
                  "kobra_software/kobra_launcher.py",
                  "kobra_software/packaging/instalar_windows.ps1",
                  "kobra_software/packaging/desinstalar_windows.ps1",
                  "kobra_software/electron/build/icon.ico",
              ) if n not in nombres]
              con_bom = [n for n in nombres if n.lower().endswith(".bat")
                         and f.read(n).startswith(b"\xef\xbb\xbf")]
          if faltan:   sys.exit(f"Al paquete le faltan piezas: {faltan}")
          if con_bom:  sys.exit(f".bat con BOM (cmd.exe falla al abrirlos): {con_bom}")
          if not ed.get("owner"): sys.exit(f"edicion.json no es owner: {ed}")
          if ed.get("dias") or ed.get("plan"):
              sys.exit(f"la edición owner no puede llevar límite: {ed}")
          print(f"OK: {len(nombres)} archivos, edicion={ed}")
          PY

      - name: Publicar la release (repo privado)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v${{ inputs.version || steps.armar.outputs.version }}
          name: MV Kobra AI · Owner v${{ inputs.version || steps.armar.outputs.version }}
          files: ${{ steps.armar.outputs.zip }}
          # Nunca `latest`: el enlace `/releases/latest/download/...` de la
          # landing tiene que seguir apuntando al instalador de clientes.
          make_latest: false
          body: |
            **Edición Owner — copia del dueño.** Sin licencia, sin trial y sin
            vencimiento. Acceso completo a todas las empresas y pantallas.

            ### ⬇️ Qué descargar
            - **`MVKobraAI_Owner_Instalador_v*.zip`** ← **este es el programa.**
              Adentro está `MVKobraAI_Setup_OWNER.exe`: el instalador de la app
              de escritorio (Electron + React, sin Streamlit). Descomprimí,
              ejecutá el `.exe` y seguí el asistente. No necesita Python.
            - `MVKobraAI_Owner_v*.zip` — edición para correr desde el CÓDIGO
              FUENTE con Python. **No contiene ningún `.exe`.** Solo si querés
              tocar el código.

            ### Cómo usar la edición de código fuente (opcional)
            1. Descargá y descomprimí `MVKobraAI_Owner_v*.zip`.
            2. `INSTALAR.bat` → deja el programa instalado con icono propio,
               acceso en el Escritorio, entrada en el Menú Inicio y
               desinstalador en «Agregar o quitar programas». No pide permisos
               de administrador.
            3. También podés abrirlo sin instalar, con `INICIAR_OWNER.bat`.

            Al desinstalar, tus datos **no** se borran salvo que lo pidas.

            ### No redistribuir
            Esta edición no valida licencia: quien la tenga usa el producto
            completo sin límite. Por eso se publica solo en este repositorio
            privado y nunca en el repo público de descargas.

            > El motor de cumplimiento (horarios de contacto, feriados, pedidos
            > de no-contactar) sigue activo también acá. No es una restricción
            > comercial: es lo que hace legal usar el producto con deudores
            > reales (Ley 18.331). Desactivarlo te expondría a vos.

  # ---------------------------------------------------------------------------
  # Instalador .exe de la edición Owner
  # ---------------------------------------------------------------------------
  # El job de arriba publica un ZIP que necesita Python en la máquina. Este arma
  # el INSTALADOR de Windows del dueño: mismo pipeline que el de clientes
  # (PyInstaller + Electron + NSIS), asistente gráfico, iconos, desinstalador y
  # sin necesidad de Python.
  #
  # Identidad propia (electron-builder.owner.yml): appId, productName, carpeta y
  # accesos distintos, así el Owner y la copia de cliente CONVIVEN en la misma
  # máquina. Con el mismo appId, instalar uno pisaría al otro.
  #
  # Se publica solo en las releases de este repo PRIVADO. Nunca en
  # `mv-kobra-ai-releases`: esta edición arranca sin licencia ni vencimiento.
  instalador:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Generar datos y modelo
        run: python -m kobra.pipeline

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar la app React
        run: |
          cd webapp/frontend
          npm ci
          npm run build

      - name: Marcar el bundle como edición Owner
        # kobra.spec incluye edicion.json si existe, y
        # kobra_launcher.py::_activar_edicion la lee al arrancar: con
        # owner=true entra directo, sin licencia ni activación. El build de
        # clientes no genera este archivo, así que no se ve afectado.
        shell: pwsh
        run: |
          '{"edition":"Owner","plan":null,"dias":null,"owner":true}' |
            Set-Content -Path edicion.json -Encoding utf8
          Get-Content edicion.json

      - name: Construir ejecutable (PyInstaller)
        run: pyinstaller packaging/kobra.spec --noconfirm --clean

      - name: Verificar que el bundle quedó marcado como Owner
        # Si edicion.json no viajó, el instalador Owner pediría licencia como
        # el de un cliente: sería el mismo producto con otro nombre.
        shell: pwsh
        run: |
          $f = "dist/MVKobraAI/_internal/edicion.json"
          if (-Not (Test-Path $f)) { $f = "dist/MVKobraAI/edicion.json" }
          if (-Not (Test-Path $f)) {
            Write-Error "edicion.json no entro al bundle: el .exe no seria Owner"; exit 1
          }
          $ed = Get-Content $f -Raw | ConvertFrom-Json
          if (-not $ed.owner) { Write-Error "el bundle no es Owner: $($ed | ConvertTo-Json -Compress)"; exit 1 }
          Write-Host "Bundle Owner OK"

      - name: Prueba de humo — que el motor ARRANQUE
        # Misma razón que en build_windows.yml: Test-Path da por bueno un bundle
        # al que le falta un import. Acá se levanta el motor y se le pega a la
        # API; si no responde, el build falla antes de publicar nada.
        shell: pwsh
        run: |
          $env:KOBRA_APP_PORT = "8542"
          $env:KOBRA_SIN_NAVEGADOR = "1"
          $p = Start-Process -FilePath "dist/MVKobraAI/MVKobraAI.exe" `
                             -PassThru -RedirectStandardError motor_err.log `
                             -RedirectStandardOutput motor_out.log
          $url = "http://127.0.0.1:8542/api/licencia/estado"
          $ok = $false
          foreach ($i in 1..60) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) {
                $ok = $true
                # Y que de verdad entre como owner, no pidiendo licencia.
                $estado = $r.Content | ConvertFrom-Json
                if (-not $estado.owner) {
                  Write-Error "el motor arranco pero NO en modo owner: $($r.Content)"; exit 1
                }
                break
              }
            } catch { Start-Sleep -Seconds 2 }
          }
          # La API sana NO alcanza: la v1.3.0 salio con la API perfecta y la
          # PANTALLA NEGRA — la CSP de la API en el index.html hacia que el
          # navegador se negara a cargar el JS/CSS de la propia app. Aca se
          # verifica lo que el usuario ve: el index se sirve, referencia un
          # bundle JS, ese bundle responde 200, y la CSP no lo bloquea.
          if ($ok) {
            try {
              $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8542/" -UseBasicParsing -TimeoutSec 5
              $csp = [string]$ui.Headers["Content-Security-Policy"]
              if ($csp -match "default-src 'none'") {
                Write-Error "la UI sale con la CSP de la API (pantalla negra): $csp"; $ok = $false
              }
              $js = [regex]::Match($ui.Content, 'src="(/assets/[^"]+\.js)"').Groups[1].Value
              if (-not $js) {
                Write-Error "el index.html no referencia ningun bundle JS"; $ok = $false
              } else {
                $rjs = Invoke-WebRequest -Uri ("http://127.0.0.1:8542" + $js) -UseBasicParsing -TimeoutSec 5
                if ($rjs.StatusCode -ne 200) {
                  Write-Error "el bundle JS no se sirve: $js -> $($rjs.StatusCode)"; $ok = $false
                } else {
                  Write-Host "UI OK: index + $js servidos y CSP compatible"
                }
              }
            } catch { Write-Error "la interfaz no se pudo verificar: $_"; $ok = $false }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Write-Host "--- stdout ---"; Get-Content motor_out.log -EA SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content motor_err.log -EA SilentlyContinue
            Write-Error "El motor empaquetado no respondio: el instalador saldria roto."
            exit 1
          }
          Write-Host "Motor OK y en modo owner"

      - name: Leer versión
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kobra,sys;sys.stdout.write(kobra.__version__)"
          "KVER=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Construir instalador Owner (NSIS)
        shell: pwsh
        run: |
          cd electron
          npm pkg set version=${{ steps.ver.outputs.KVER }}
          npm ci
          npx electron-builder --win nsis --config electron-builder.owner.yml --publish never
          if (-Not (Test-Path "dist_installer_owner/MVKobraAI_Setup_OWNER.exe")) {
            Write-Error "No se genero el instalador Owner"; exit 1
          }
          Copy-Item "dist_installer_owner/MVKobraAI_Setup_OWNER.exe" ../dist/
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Empaquetar el instalador dentro de un ZIP
        # Pedido del dueño: que el .exe venga ADENTRO de un ZIP en la release
        # (un solo archivo para descargar, con instrucciones al lado), en vez
        # de tener que distinguirlo del ZIP de código fuente en la lista de
        # assets — que es justo la confusión que ya pasó.
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.KVER }}"
          $leeme = @(
            "MV Kobra AI - Edicion Owner v$ver (instalador de escritorio)",
            "=============================================================",
            "",
            "1) Ejecuta MVKobraAI_Setup_OWNER.exe",
            "2) Segui el asistente (no pide permisos de administrador).",
            "3) Abri 'MV Kobra AI (Owner)' desde el Escritorio o el Menu Inicio.",
            "",
            "El instalador ya incluye todo: no necesita Python ni Node.",
            "Es la app de escritorio (Electron + React), no usa Streamlit.",
            "",
            "NO REDISTRIBUIR: esta edicion no valida licencia."
          ) -join "`r`n"
          Set-Content -Path dist/LEEME_INSTALADOR.txt -Value $leeme -Encoding utf8
          Compress-Archive -Force `
            -Path dist/MVKobraAI_Setup_OWNER.exe, dist/LEEME_INSTALADOR.txt `
            -DestinationPath "dist/MVKobraAI_Owner_Instalador_v$ver.zip"
          Get-Item "dist/MVKobraAI_Owner_Instalador_v$ver.zip" |
            ForEach-Object { Write-Host "ZIP: $($_.Name) $([math]::Round($_.Length/1MB)) MB" }

      - name: Publicar en la release Owner (repo privado)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v${{ inputs.version || steps.ver.outputs.KVER }}
          name: MV Kobra AI · Owner v${{ inputs.version || steps.ver.outputs.KVER }}
          files: |
            dist/MVKobraAI_Owner_Instalador_v${{ steps.ver.outputs.KVER }}.zip
            dist/MVKobraAI_Setup_OWNER.exe
          # Nunca `latest`: ese enlace tiene que seguir sirviendo el instalador
          # de clientes.
          make_latest: false
