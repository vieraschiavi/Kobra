# Publica la edición OWNER como release descargable — SOLO en este repo privado.
#
# Por qué acá y no en `mv-kobra-ai-releases`: ese repo es PÚBLICO y es donde va
# el instalador de clientes. La edición Owner arranca sin licencia, sin trial y
# sin vencimiento (`edicion.json` → `owner: true`), así que publicarla ahí
# equivale a regalar el producto completo: cualquiera que la baje la usa sin
# límite y sin pagar. Este workflow escribe únicamente en las releases de
# `vieraschiavi/Kobra`, que es privado — visible solo para vos y los
# colaboradores del repo.
#
# Disparos:
#   1. AUTOMÁTICO: push a `main` que toque `kobra/__init__.py` — o sea, cada
#      vez que se mergea un cambio de versión. El job `decidir` chequea si la
#      release `owner-v<versión>` ya tiene el instalador publicado: si ya
#      está, no se gasta ni un minuto de build. Así "se dispara solo cuando
#      es necesario": subir la versión + mergear = release publicada.
#   2. Manual (Actions → Release Owner → Run workflow) — siempre publica.
#   3. Tag `owner-vX.Y.Z` — siempre publica (el filtro de paths no aplica a
#      los tags, es comportamiento documentado de GitHub).
name: Release Owner

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej. 1.3.0). Vacío = la de build_release.py"
        required: false
        type: string
      publicar_aunque_el_repo_sea_publico:
        description: "Escribí PUBLICO (en mayúsculas) para publicar igual con el repo abierto. Cualquiera con el link se baja el producto completo."
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    tags:
      - "owner-v*"
    paths:
      - "kobra/__init__.py"

permissions:
  contents: write        # crear la release y subirle el ZIP

jobs:
  # ¿Hace falta publicar? Solo si la release de ESTA versión no tiene ya el
  # instalador. El disparo manual y el tag saltean el chequeo (son pedidos
  # explícitos); el push a main lo respeta para no republicar en re-runs.
  decidir:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.check.outputs.publicar }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # El repositorio TIENE que ser privado para publicar esto.
      #
      # Todo este workflow se escribió sobre la premisa de que
      # `vieraschiavi/Kobra` era privado — está en el comentario de arriba. La
      # premisa dejó de ser cierta (o nunca lo fue), y nadie se enteró: el
      # instalador Owner arranca sin licencia, sin trial y sin vencimiento, así
      # que publicado en un repo público es el producto completo regalado, con
      # URL de descarga directa y sin necesidad de cuenta.
      #
      # Un comentario no protege nada. Esto sí: si el repo es público, el
      # workflow corta acá y no sube un solo byte.
      - name: El repo tiene que ser privado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VIS=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          echo "Visibilidad de ${{ github.repository }}: $VIS"
          if [ "$VIS" = "private" ]; then
            exit 0
          fi

          # La salida de emergencia. Solo existe para el disparo MANUAL: en un
          # push a main `inputs` viene vacio, asi que subir la version con el
          # repo abierto sigue cortando. Y hay que ESCRIBIR la palabra: un
          # checkbox se tilda sin leer, esto no.
          if [ "${{ inputs.publicar_aunque_el_repo_sea_publico }}" = "PUBLICO" ]; then
            echo "::warning::Publicando la edicion Owner en un repositorio $VIS a pedido explicito."
            echo "::warning::El .exe queda descargable por cualquiera, sin cuenta y sin licencia."
            echo "::warning::Cuando termines de probar: pone el repo en privado y borra el asset."
            {
              echo "### Edicion Owner publicada en un repo **$VIS**"
              echo ""
              echo "Se pidio explicitamente con \`publicar_aunque_el_repo_sea_publico=PUBLICO\`."
              echo "Mientras el repo siga abierto, cualquiera con el link se baja el"
              echo "producto completo: sin licencia, sin trial y sin vencimiento."
              echo ""
              echo "**Pendiente:** poner el repo en privado y borrar el asset."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "::error::La edicion Owner NO se publica en un repositorio $VIS."
          echo "::error::Entra sin licencia y sin vencimiento: publicarla aca"
          echo "::error::equivale a regalar el producto a cualquiera con el link."
          echo "::error::Opciones: (a) pone el repo en privado — vos vas a poder"
          echo "::error::bajar la release igual, es tuya; o (b) corre este workflow"
          echo "::error::a mano escribiendo PUBLICO en el campo correspondiente."
          exit 1

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' kobra/__init__.py)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "Disparo explícito (manual/tag): se publica owner-v$V."
            exit 0
          fi
          if gh release view "owner-v$V" --json assets -q '.assets[].name' 2>/dev/null \
             | grep -q "MVKobraAI_Setup_OWNER.exe"; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "owner-v$V ya tiene el instalador publicado: nada que hacer."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "owner-v$V no está publicada: se construye y publica."
          fi

  # ---------------------------------------------------------------------------
  # Instalador .exe de la edición Owner
  # ---------------------------------------------------------------------------
  # El job de arriba publica un ZIP que necesita Python en la máquina. Este arma
  # el INSTALADOR de Windows del dueño: mismo pipeline que el de clientes
  # (PyInstaller + Electron + NSIS), asistente gráfico, iconos, desinstalador y
  # sin necesidad de Python.
  #
  # Identidad propia (electron-builder.owner.yml): appId, productName, carpeta y
  # accesos distintos, así el Owner y la copia de cliente CONVIVEN en la misma
  # máquina. Con el mismo appId, instalar uno pisaría al otro.
  #
  # Se publica solo en las releases de este repo PRIVADO. Nunca en
  # `mv-kobra-ai-releases`: esta edición arranca sin licencia ni vencimiento.
  instalador:
    needs: decidir
    if: needs.decidir.outputs.publicar == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Generar datos y modelo
        run: python -m kobra.pipeline

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar la app React
        run: |
          cd webapp/frontend
          npm ci
          npm run build

      - name: Construir ejecutable (PyInstaller, edición CLIENTE)
        # SIN edicion.json: este bundle es el de clientes (demo de 3 días;
        # al vencer, la app pide la licencia comprada y pasa a ser la
        # versión oficial). La marca Owner se inyecta DESPUÉS de armar el
        # instalador de clientes — así PyInstaller corre una sola vez.
        run: pyinstaller packaging/kobra.spec --noconfirm --clean

      - name: Leer versión
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import kobra,sys;sys.stdout.write(kobra.__version__)"
          "KVER=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Regenerar las licencias del asistente
        # Llevan la versión adentro: sin esto, el instalador muestra el EULA
        # de una versión vieja (mismo paso que en build_windows.yml).
        run: python packaging/licencias_instalador.py

      - name: Marcar el bundle como edición Owner
        # kobra_launcher.py::_activar_edicion lee edicion.json de _MEIPASS —
        # que en un build onedir de PyInstaller 6 es la carpeta _internal/.
        # Inyectarla acá equivale a haberla empaquetado desde el spec, sin
        # pagar una segunda compilación completa.
        shell: pwsh
        env:
          # El sello lleva un token firmado con la privada del dueño: sin él,
          # `owner: true` no vale nada (kobra/edicion.py lo verifica contra la
          # pública embebida). Emitirlo una vez con
          # `backend_venta.licencias.emitir_sello_owner()` y guardarlo como
          # secret OWNER_SELLO_TOKEN.
          KOBRA_OWNER_SELLO: ${{ secrets.OWNER_SELLO_TOKEN }}
        run: |
          if (-not $env:KOBRA_OWNER_SELLO) {
            Write-Error "Falta el secret OWNER_SELLO_TOKEN: sin el token firmado el build Owner saldria pidiendo licencia como el de un cliente."
            exit 1
          }
          $dest = "dist/MVKobraAI/_internal"
          if (-Not (Test-Path $dest)) { $dest = "dist/MVKobraAI" }
          $sello = @{ edition = "Owner"; plan = $null; dias = $null;
                      owner = $true; token_owner = $env:KOBRA_OWNER_SELLO }
          ($sello | ConvertTo-Json -Compress) |
            Set-Content -Path "$dest/edicion.json" -Encoding utf8
          # Sin volcar el contenido: el token es una credencial y el log del
          # workflow queda guardado.
          Write-Host "edicion.json escrito ($((Get-Item "$dest/edicion.json").Length) bytes)"

      - name: Verificar que el bundle quedó marcado como Owner
        # Si edicion.json no viajó, el instalador Owner pediría licencia como
        # el de un cliente: sería el mismo producto con otro nombre.
        shell: pwsh
        run: |
          $f = "dist/MVKobraAI/_internal/edicion.json"
          if (-Not (Test-Path $f)) { $f = "dist/MVKobraAI/edicion.json" }
          if (-Not (Test-Path $f)) {
            Write-Error "edicion.json no entro al bundle: el .exe no seria Owner"; exit 1
          }
          $ed = Get-Content $f -Raw | ConvertFrom-Json
          if (-not $ed.owner) { Write-Error "el bundle no es Owner: $($ed | ConvertTo-Json -Compress)"; exit 1 }
          Write-Host "Bundle Owner OK"

      - name: Prueba de humo — que el motor ARRANQUE
        # Misma razón que en build_windows.yml: Test-Path da por bueno un bundle
        # al que le falta un import. Acá se levanta el motor y se le pega a la
        # API; si no responde, el build falla antes de publicar nada.
        shell: pwsh
        run: |
          $env:KOBRA_APP_PORT = "8542"
          $env:KOBRA_SIN_NAVEGADOR = "1"
          $p = Start-Process -FilePath "dist/MVKobraAI/MVKobraAI.exe" `
                             -PassThru -RedirectStandardError motor_err.log `
                             -RedirectStandardOutput motor_out.log
          $url = "http://127.0.0.1:8542/api/licencia/estado"
          $ok = $false
          foreach ($i in 1..60) {
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200) {
                $ok = $true
                # Y que de verdad entre como owner, no pidiendo licencia.
                $estado = $r.Content | ConvertFrom-Json
                if (-not $estado.owner) {
                  Write-Error "el motor arranco pero NO en modo owner: $($r.Content)"; exit 1
                }
                break
              }
            } catch { Start-Sleep -Seconds 2 }
          }
          # La API sana NO alcanza: la v1.3.0 salio con la API perfecta y la
          # PANTALLA NEGRA — la CSP de la API en el index.html hacia que el
          # navegador se negara a cargar el JS/CSS de la propia app. Aca se
          # verifica lo que el usuario ve: el index se sirve, referencia un
          # bundle JS, ese bundle responde 200, y la CSP no lo bloquea.
          if ($ok) {
            try {
              $ui = Invoke-WebRequest -Uri "http://127.0.0.1:8542/" -UseBasicParsing -TimeoutSec 5
              $csp = [string]$ui.Headers["Content-Security-Policy"]
              if ($csp -match "default-src 'none'") {
                Write-Error "la UI sale con la CSP de la API (pantalla negra): $csp"; $ok = $false
              }
              $js = [regex]::Match($ui.Content, 'src="(/assets/[^"]+\.js)"').Groups[1].Value
              if (-not $js) {
                Write-Error "el index.html no referencia ningun bundle JS"; $ok = $false
              } else {
                $rjs = Invoke-WebRequest -Uri ("http://127.0.0.1:8542" + $js) -UseBasicParsing -TimeoutSec 5
                if ($rjs.StatusCode -ne 200) {
                  Write-Error "el bundle JS no se sirve: $js -> $($rjs.StatusCode)"; $ok = $false
                } else {
                  Write-Host "UI OK: index + $js servidos y CSP compatible"
                }
              }
            } catch { Write-Error "la interfaz no se pudo verificar: $_"; $ok = $false }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Write-Host "--- stdout ---"; Get-Content motor_out.log -EA SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content motor_err.log -EA SilentlyContinue
            Write-Error "El motor empaquetado no respondio: el instalador saldria roto."
            exit 1
          }
          Write-Host "Motor OK y en modo owner"

      - name: Construir instalador Owner (NSIS)
        # Identidad propia (electron-builder.owner.yml): appId, carpeta y
        # accesos distintos, así Owner y copia de cliente conviven en la
        # misma máquina. npm ya quedó preparado en el paso de clientes.
        shell: pwsh
        run: |
          cd electron
          npx electron-builder --win nsis --config electron-builder.owner.yml --publish never
          if (-Not (Test-Path "dist_installer_owner/MVKobraAI_Setup_OWNER.exe")) {
            Write-Error "No se genero el instalador Owner"; exit 1
          }
          Copy-Item "dist_installer_owner/MVKobraAI_Setup_OWNER.exe" ../dist/
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Generar Owner.bat (la vía sin volver a descargar 270 MB)
        # Se genera en la corrida y NO se toma del repo: `packaging/Owner.bat`
        # dejó de estar commiteado a propósito — un Owner.bat con sello válido
        # dentro del repositorio es una herramienta lista para convertir
        # cualquier instalación en la del dueño.
        #
        # Este paso vivía adentro del que armaba el ZIP. Al sacar el ZIP se fue
        # con él, y la publicación quedó apuntando a un archivo que ya nadie
        # creaba: la release habría fallado al subirlo.
        shell: pwsh
        env:
          KOBRA_OWNER_SELLO: ${{ secrets.OWNER_SELLO_TOKEN }}
        run: |
          if (-not $env:KOBRA_OWNER_SELLO) {
            Write-Error "Falta el secret OWNER_SELLO_TOKEN: Owner.bat saldria escribiendo un sello sin firma, que el programa ignora."
            exit 1
          }
          python packaging/generar_owner_bat.py
          if (-Not (Test-Path "packaging/Owner.bat")) {
            Write-Error "No se genero packaging/Owner.bat"; exit 1
          }

      - name: Publicar en la release Owner (repo privado)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: owner-v${{ inputs.version || steps.ver.outputs.KVER }}
          name: MV Kobra AI · Owner v${{ inputs.version || steps.ver.outputs.KVER }}
          body: |
            **Edición Owner — la copia del dueño.** Entra directo: sin
            licencia, sin trial y sin vencimiento. Acceso completo a todas
            las empresas y pantallas.

            ### Qué bajar

            - **`MVKobraAI_Setup_OWNER.exe`** ← esto es el programa.
              Electron + React, sin Python. Deja ícono en el Escritorio,
              entrada en el Menú Inicio y desinstalador en «Agregar o quitar
              programas». Se instala con nombre y carpeta propios, así que
              **convive** con la copia de clientes en la misma máquina —
              que es lo que hace falta para ver qué ve un comprador sin
              perder la tuya.
            - `Owner.bat` — 2 KB. Solo si el programa de CLIENTES **ya está
              instalado** y no querés bajar 270 MB de nuevo: le saca el
              trial y la clave a esa copia. Doble clic; si no encuentra la
              instalación, copialo a la carpeta del programa.

            El instalador de **clientes** no está acá: vive en la release
            `vX.Y.Z` de este mismo repo (y en el repo público de descargas).
            Se instala como demo completa por 3 días y al vencer pide la
            licencia que el cliente recibe al comprar.

            ### No redistribuir

            Esta edición no valida licencia: quien la tenga usa el producto
            completo sin límite. Por eso se publica solo en este repositorio
            privado y **nunca** en `mv-kobra-ai-releases`, que es público.

            > El motor de cumplimiento (horarios de contacto, feriados,
            > pedidos de no-contactar) sigue activo también acá. No es una
            > restricción comercial: es lo que hace legal usar el producto
            > con deudores reales (Ley 18.331). Desactivarlo te expondría a vos.
          # UN solo instalador por release, y el .bat que convierte una copia
          # ya instalada. Antes iban cuatro archivos y tres eran redundantes:
          #
          #   * el ZIP `MVKobraAI_Instaladores_*` (535 MB) traía los DOS .exe
          #     adentro — los mismos que ya viajaban sueltos al lado;
          #   * `MVKobraAI_Setup.exe` es el instalador de CLIENTES, que ya
          #     publica build_windows.yml en la release vX.Y.Z. Duplicarlo acá
          #     sumaba 268 MB y abría la puerta a que las dos copias quedaran
          #     en versiones distintas;
          #   * el ZIP de código fuente (`MVKobraAI_Owner_*`) necesitaba Python
          #     instalado, que es justo lo que el .exe vino a evitar.
          #
          # Cada release pesa ahora ~270 MB en vez de ~1 GB, y no hay que
          # explicar cuál de los cuatro archivos bajar.
          files: |
            dist/MVKobraAI_Setup_OWNER.exe
            packaging/Owner.bat
          # Nunca `latest`: ese enlace tiene que seguir sirviendo el instalador
          # de clientes.
          make_latest: false
