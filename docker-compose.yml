# MV Kobra AI · despliegue de producción (dashboard + servicio realtime)
# Uso:
#   docker compose up --build
#   Dashboard:  http://localhost:8501
#   Realtime:   http://localhost:8000   (copiloto de audio en vivo)
#
# Las API keys se pueden cargar de 3 formas (prioridad de arriba a abajo):
#   1) variables de entorno / archivo .env (OPENAI_API_KEY, ANTHROPIC_API_KEY)
#   2) desde el dashboard → pestaña "Configuración" (se guardan en el volumen kobra-config)
#   3) sin keys: MV Kobra AI funciona igual (sin transcripción Whisper ni Claude)
#
# El servicio realtime pide credenciales (ver realtime/acceso.py). El token se
# genera solo la primera vez y se imprime al arrancar:
#   docker compose logs realtime | grep "Token de acceso"
# Después se entra con  http://localhost:8000/?t=EL-TOKEN

services:
  # La app completa para el SERVIDOR O LA VM DEL CLIENTE.
  #
  # Es el modo para trabajar desde una laptop corporativa donde no se puede
  # instalar nada: el programa corre acá, se usa por el navegador, y la cartera
  # del cliente queda en los volúmenes de ESTA máquina. Nada se copia a la
  # laptop de quien lo usa, que es la pregunta que hace el área de seguridad.
  #
  #   KOBRA_OWNER_TOKEN=...  docker compose up -d app
  #   Navegador:             http://<este-servidor>:8080
  app:
    build: .
    image: kobra:latest
    command: ["app"]
    ports:
      # 127.0.0.1 a propósito: por defecto solo se llega desde la propia
      # máquina (o por un túnel SSH), porque este modo entra SIN contraseña.
      # Para exponerlo en la red del cliente, sacar el prefijo y poner el
      # servicio detrás de su proxy con autenticación. Está explicado en
      # docs/MODOS_INSTALACION.md.
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - KOBRA_CONFIG_DIR=/config
      # El sello firmado del dueño: entra sin licencia y sin trial. NO va
      # dentro de la imagen — se pasa acá o como secreto montado en archivo
      # (KOBRA_OWNER_TOKEN_FILE).
      - KOBRA_OWNER_TOKEN=${KOBRA_OWNER_TOKEN:-}
      - KOBRA_OWNER_TOKEN_FILE=${KOBRA_OWNER_TOKEN_FILE:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - kobra-config:/config
      - kobra-data:/app/data
      - kobra-outputs:/app/outputs
    restart: unless-stopped

  dashboard:
    build: .
    image: kobra:latest
    command: ["dashboard"]
    ports:
      - "8501:8501"
    environment:
      - KOBRA_CONFIG_DIR=/config
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - kobra-config:/config
      - kobra-data:/app/data
      - kobra-outputs:/app/outputs
    restart: unless-stopped

  realtime:
    build: .
    image: kobra:latest
    command: ["realtime"]
    environment:
      - PORT=8000
      - KOBRA_CONFIG_DIR=/config
      # El contenedor tiene su propia red: atado a su loopback, el servicio no
      # responde por el puerto publicado abajo. Ver docker-entrypoint.sh.
      - KOBRA_REALTIME_HOST=0.0.0.0
      # El servicio pide token (realtime/acceso.py). Si no se fija acá, se
      # genera solo en el primer arranque, queda en el volumen kobra-config y
      # se imprime en el log: `docker compose logs realtime`.
      - KOBRA_REALTIME_TOKEN=${KOBRA_REALTIME_TOKEN:-}
      # Sin esto, los webhooks de voz de Twilio se rechazan: no se puede
      # verificar la firma, y no verificar no puede significar aceptar.
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - kobra-config:/config
      - kobra-data:/app/data
      - kobra-outputs:/app/outputs
    restart: unless-stopped

volumes:
  kobra-config:
  kobra-data:
  kobra-outputs:
