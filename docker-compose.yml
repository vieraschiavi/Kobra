# MV Kobra AI · despliegue de producción (dashboard + servicio realtime)
# Uso:
#   docker compose up --build
#   Dashboard:  http://localhost:8501
#   Realtime:   http://localhost:8000   (copiloto de audio en vivo)
#
# Las API keys se pueden cargar de 3 formas (prioridad de arriba a abajo):
#   1) variables de entorno / archivo .env (OPENAI_API_KEY, ANTHROPIC_API_KEY)
#   2) desde el dashboard → pestaña "Configuración" (se guardan en el volumen kobra-config)
#   3) sin keys: MV Kobra AI funciona igual (sin transcripción Whisper ni Claude)
#
# El servicio realtime pide credenciales (ver realtime/acceso.py). El token se
# genera solo la primera vez y se imprime al arrancar:
#   docker compose logs realtime | grep "Token de acceso"
# Después se entra con  http://localhost:8000/?t=EL-TOKEN

services:
  dashboard:
    build: .
    image: kobra:latest
    command: ["dashboard"]
    ports:
      - "8501:8501"
    environment:
      - KOBRA_CONFIG_DIR=/config
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - kobra-config:/config
      - kobra-data:/app/data
      - kobra-outputs:/app/outputs
    restart: unless-stopped

  realtime:
    build: .
    image: kobra:latest
    command: ["realtime"]
    environment:
      - PORT=8000
      - KOBRA_CONFIG_DIR=/config
      # El contenedor tiene su propia red: atado a su loopback, el servicio no
      # responde por el puerto publicado abajo. Ver docker-entrypoint.sh.
      - KOBRA_REALTIME_HOST=0.0.0.0
      # El servicio pide token (realtime/acceso.py). Si no se fija acá, se
      # genera solo en el primer arranque, queda en el volumen kobra-config y
      # se imprime en el log: `docker compose logs realtime`.
      - KOBRA_REALTIME_TOKEN=${KOBRA_REALTIME_TOKEN:-}
      # Sin esto, los webhooks de voz de Twilio se rechazan: no se puede
      # verificar la firma, y no verificar no puede significar aceptar.
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - kobra-config:/config
      - kobra-data:/app/data
      - kobra-outputs:/app/outputs
    restart: unless-stopped

volumes:
  kobra-config:
  kobra-data:
  kobra-outputs:
