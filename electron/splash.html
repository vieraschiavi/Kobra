<html lang="es">
<head>
<meta charset="utf-8">
<title>MV Kobra AI</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0b1220; color: #e7eef9;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; overflow: hidden;
  }
  .caja { text-align: center; }
  .logo { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  .logo span { color: #7cc242; }
  .sub { color: #93a5c0; font-size: 14px; margin-top: 10px; }
  .barra {
    margin: 26px auto 0; width: 240px; height: 4px; border-radius: 4px;
    background: #1c2940; overflow: hidden; position: relative;
  }
  .barra::after {
    content: ""; position: absolute; left: -40%; top: 0; height: 100%;
    width: 40%; border-radius: 4px; background: #7cc242;
    animation: correr 1.2s ease-in-out infinite;
  }
  @keyframes correr { to { left: 100%; } }
</style>
</head>
<body>
  <div class="caja">
    <div class="logo">MV KOBRA <span>AI</span></div>
    <div class="sub">Iniciando el motor de cobranzas…</div>
    <div class="barra"></div>
  </div>
</body>
</html>
